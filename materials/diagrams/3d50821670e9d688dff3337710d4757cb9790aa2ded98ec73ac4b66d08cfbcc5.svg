          <path class="photons-h" d="M0 148 q8 -7 16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0"/>
        </g>
        <rect class="voxel" x="132" y="126" width="32" height="28" rx="3" fill="var(--fg)"/>
        <text class="lbl" x="150" y="300" font-size="14" text-anchor="middle">cures only where both meet</text>
        <text class="lbl sub" x="268" y="144" font-size="13">IR heat</text><text class="lbl sub" x="188" y="47" font-size="13">UV</text>
      </svg>