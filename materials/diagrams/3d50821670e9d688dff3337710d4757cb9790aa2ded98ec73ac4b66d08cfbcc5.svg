<svg viewBox="0 0 300 300" aria-label="UV and infrared heat meet and cure where they overlap">
        <defs>
          <linearGradient id="ls-fadeIR" x1="0" y1="0" x2="300" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#fff"/><stop offset=".72" stop-color="#000"/></linearGradient>
          <mask id="ls-mIR"><rect width="300" height="300" fill="url(#ls-fadeIR)"/></mask>
          <linearGradient id="ls-fadeUV2" x1="0" y1="0" x2="0" y2="300" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff"/><stop offset=".45" stop-color="#fff"/><stop offset=".6" stop-color="#000"/></linearGradient>
          <mask id="ls-mUV2"><rect width="300" height="300" fill="url(#ls-fadeUV2)"/></mask>
        </defs>
        <g class="tissue"></g>
        <g mask="url(#ls-mUV2)" stroke="var(--lav)" stroke-width="3"><line class="photons" x1="140" y1="54" x2="140" y2="290"/><line class="photons" x1="156" y1="54" x2="156" y2="290"/></g>
        <g mask="url(#ls-mIR)" stroke="var(--rose)" stroke-width="2.4" fill="none">
