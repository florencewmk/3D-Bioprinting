<svg viewBox="0 0 300 300" aria-label="UV light stops near the surface">
        <defs>
          <linearGradient id="ls-fadeUV" x1="0" y1="0" x2="0" y2="300" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff"/><stop offset=".25" stop-color="#fff"/><stop offset=".4" stop-color="#000"/></linearGradient>
          <mask id="ls-mUV"><rect width="300" height="300" fill="url(#ls-fadeUV)"/></mask>
          <linearGradient id="ls-fadeNIR" x1="0" y1="0" x2="0" y2="300" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff"/><stop offset=".6" stop-color="#fff"/><stop offset=".88" stop-color="#000"/></linearGradient>
          <mask id="ls-mNIR"><rect width="300" height="300" fill="url(#ls-fadeNIR)"/></mask>
        </defs>
        <g class="tissue"></g>
        <g mask="url(#ls-mUV)" stroke="var(--lav)" stroke-width="3">
          <line class="photons" x1="132" y1="54" x2="132" y2="290"/><line class="photons" x1="150" y1="54" x2="150" y2="290"/><line class="photons" x1="168" y1="54" x2="168" y2="290"/>
        </g>
        <g fill="none" stroke="var(--rose)" stroke-width="2.4" class="hit">
          <path d="M124 92 l10 10 m0 -10 l-10 10"/><path d="M164 100 l10 10 m0 -10 l-10 10"/>
        </g>
        <line x1="180" y1="112" x2="266" y2="112" stroke="var(--muted)" stroke-dasharray="2 3"/><text class="lbl sub" x="270" y="116" font-size="13">stops</text>
      </svg>