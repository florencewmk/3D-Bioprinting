<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The woman on the tram</title>
<style>
:root{color-scheme:dark;font-family:'Jost',system-ui,sans-serif;background:#050506;color:#f8efe0}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:16px}
main{width:min(100%,calc((100dvh - 120px)*16/9),1440px)}
svg{width:100%;height:auto;display:block;border-radius:0;background:#050506}text{font-family:'Jost',system-ui,sans-serif}
nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;flex-wrap:wrap}
button{font:inherit;padding:.5em .85em;border:1px solid #697a88;border-radius:8px;background:#263849;color:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:default}button:focus-visible{outline:2px solid #f7b0c4;outline-offset:3px}
#status{font-size:.9rem;color:#d9e2e5}.scene{display:none}.scene.on{display:block;animation:appear .45s ease-out both}
.street{animation:passing 16s linear infinite}.hanging{transform-origin:0 0;animation:sway 2.8s ease-in-out infinite alternate}
#riders{transition:opacity .6s}svg[data-beat]:not([data-beat="0"]) #riders{opacity:.44}
#florence,#courier{transition:transform .8s ease,opacity .55s}
svg[data-beat="0"] #florence{animation:board .95s ease-out both}
svg[data-beat="7"] #florence{transform:translate(-280px,0);opacity:0}
svg[data-beat="7"] #courier{transform:translate(8px,0)}
svg[data-beat="7"] #door-label{visibility:hidden}
svg[data-beat="7"] .street{animation-play-state:paused}
.route{stroke-dasharray:1;stroke-dashoffset:1;animation:trace 1.6s .22s ease-in-out forwards}
.left-door,.right-door{animation:open .8s ease-out both}
.right-door{--shift:115px}.left-door{--shift:-115px}
@keyframes appear{from{opacity:0}to{opacity:1}}@keyframes passing{to{transform:translateX(-570px)}}
@keyframes sway{from{rotate:-4deg}to{rotate:4deg}}@keyframes board{from{transform:translateX(-225px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes trace{to{stroke-dashoffset:0}}@keyframes open{to{transform:translateX(var(--shift))}}
.focus-ring .ring-spin{transform-box:fill-box;transform-origin:center;animation:ring-in .7s cubic-bezier(.2,1.6,.4,1) both,ring-spin 9s linear .7s infinite}
.focus-ring .ring-pulse{transform-box:fill-box;transform-origin:center;animation:ring-pulse 1.8s ease-out .5s infinite}
@keyframes ring-in{from{transform:scale(2.2) rotate(-90deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
@keyframes ring-spin{to{transform:rotate(360deg)}}
@keyframes ring-pulse{0%{transform:scale(1);opacity:.85}100%{transform:scale(1.55);opacity:0}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.route{stroke-dashoffset:0}.left-door,.right-door{transform:translateX(var(--shift))}}
</style>

  <text x="453" y="297"><tspan font-weight="600" fill="url(#deckgrad-text)">living human tissues</tspan>, and perhaps</text>
  <text x="453" y="338">one day even <tspan font-weight="600" fill="url(#deckgrad-text)">entire organs</tspan>,</text>
  <text x="453" y="379">instead of waiting for a <tspan font-weight="600" fill="url(#deckgrad-text)">suitable donor</tspan>? 🧐</text>
 </g>
</g>
<rect width="1280" height="720" fill="url(#vignette)" pointer-events="none"/>
</svg>
<nav aria-label="Story controls">
 <div><button id="back">← Back</button> <button id="next">Next →</button></div>
 <span id="status" role="status"></span>
 <div><button id="replay">Restart</button> <button id="full">Full screen</button></div>
</nav>
</main>
<script>
const stage = document.querySelector('#stage');
const scenes = [...stage.querySelectorAll('.scene')];
const labels = ['Boarding', 'The pink jacket', 'The holiday question', 'Coming back from work', 'The job question', 'The courier', 'Poland to USA', 'The next stop'];
const back = document.querySelector('#back');
const next = document.querySelector('#next');
let beat = 0;

function show(index) {
  beat = Math.min(labels.length - 1, Math.max(0, index));
  stage.dataset.beat = beat;
  for (const scene of scenes) {
    scene.classList.toggle('on', scene.dataset.scenes.split(' ').includes(String(beat)));
  }
  back.disabled = beat === 0;
  next.disabled = beat === labels.length - 1;
  document.querySelector('#status').textContent = `${beat + 1} / ${labels.length}`;
}
back.onclick = () => show(beat - 1);
next.onclick = () => show(beat + 1);
document.querySelector('#replay').onclick = () => {
  stage.removeAttribute('data-beat');
  stage.getBoundingClientRect();
  show(0);
};
document.querySelector('#full').onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen?.();
};
document.addEventListener('keydown', event => {
  if (event.altKey || event.ctrlKey || event.metaKey) return;
  if (event.key === 'ArrowLeft') show(beat - 1);
  else if (event.key === 'ArrowRight' || (event.code === 'Space' && event.target.tagName !== 'BUTTON')) show(beat + 1);
  else return;
  event.preventDefault();
});
window.tramStory = {
  reset: () => document.querySelector('#replay').click(),
  step(direction) {
    const index = beat + direction;
    if (index < 0 || index >= labels.length) return false;
    show(index);
    return true;
  }
};
show(0);
</script>
</body></html>
