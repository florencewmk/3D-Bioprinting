<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slide 7 · Bioprinting around the world</title>
<style>
:root{color-scheme:dark;font:16px system-ui,sans-serif;color:#eef4f8;background:#090d14}
*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}
main{min-height:100svh;display:grid;grid-template-rows:auto 1fr auto;padding:clamp(18px,4vw,68px);gap:16px}
header p,.eyebrow,footer{font-size:12px;font-weight:650;letter-spacing:.16em;text-transform:uppercase;color:#aab7c4}
h1{font-size:clamp(26px,4.2vw,66px);letter-spacing:-.04em;margin:.15em 0}
.hero{display:grid;grid-template-columns:1fr 1.45fr;align-items:center;gap:24px;min-height:0}
.summary{max-width:490px}.place{font-size:clamp(29px,4vw,65px);line-height:1.05;margin:15px 0 10px}
.count{font-size:clamp(50px,7vw,105px);font-weight:720;letter-spacing:-.065em;color:#ff829a;line-height:1}
.caption{color:#bcc8d3;font-size:clamp(15px,1.6vw,22px);margin:.5em 0 1.4em}
.steps{display:flex;gap:8px;flex-wrap:wrap}.steps button{min-width:42px;height:40px}
button{border:1px solid #465265;border-radius:5px;background:#18212d;color:#f3f7fa;padding:8px 13px}
button[aria-current=true]{background:#ad2937;border-color:#ff8187}
.visual{position:relative;aspect-ratio:1;width:min(100%,65svh);justify-self:center}
canvas{filter:drop-shadow(0 0 12px #25caee38);width:100%;height:100%;display:block;cursor:grab;touch-action:none}
canvas:active{cursor:grabbing}
footer{display:flex;justify-content:flex-end;align-items:center;gap:12px;flex-wrap:wrap}
.actions{display:flex;gap:8px;flex-wrap:wrap;letter-spacing:normal;text-transform:none;font-weight:400}
#mapView{position:fixed;inset:0;background:#090d14;display:grid;grid-template-rows:auto 1fr}
#mapView[hidden],main[hidden]{display:none}
.mapbar [hidden]{display:none}
.mapbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;flex-wrap:wrap}
.legend{font-size:13px;color:#d5dce3}.pub{color:#ff868a}.company{color:#83caff}
iframe{width:100%;height:100%;border:0}
@media(max-width:700px){.hero{grid-template-columns:1fr;gap:6px}.visual{width:min(80vw,42svh);grid-row:1}.place{margin-top:8px}.caption{margin-bottom:10px}header p{margin:0}}
</style>
</head>
<body>
<main id="tour">
<header><p>Slide 07 · Publication geography</p><h1>Bioprinting around the world</h1></header>
<div class="hero">
<div class="summary" aria-live="polite">
<div class="eyebrow" id="rank"></div>
<h2 class="place" id="place"></h2>
<div class="count" id="count"></div>
<p class="caption">Publications · 2000–2025</p>
<nav class="steps" id="steps" aria-label="Choose a publication rank"></nav>
</div>
<div class="visual"><canvas id="earth" width="800" height="800" role="img" aria-label="Rotating globe showing the five leading publication countries"></canvas></div>
</div>
<footer><div class="actions"><button id="openMap">↓ Explore map</button></div></footer>
</main>
<div id="mapView" hidden>
<div class="mapbar"><div class="legend"><span class="pub">● Publication ranks 1–5</span> &nbsp; <span class="company">● Company ranks 1–5, including ties</span></div><div class="actions"><button id="backToGlobe">← Back to globe</button><button id="nextSlide" hidden>Next slide →</button></div></div>
<iframe id="atlas" title="Interactive bioprinting map"></iframe>
</div>
<script type="application/json" id="world">__WORLD__</script>
<script type="application/json" id="leaders">__LEADERS__</script>
<script type="application/json" id="atlasDocument">__ATLAS__</script>
<script>
const byId = id => document.getElementById(id);
const leaders = JSON.parse(byId('leaders').textContent);
const world = JSON.parse(byId('world').textContent);
const redLand = new Set(__RED_LAND__);
const globe = byId('earth');
const ctx = globe.getContext('2d');
const center = 400, radius = 370, rad = Math.PI / 180;
function vector(lat, lon) {
  const c = Math.cos(lat * rad);
  return [c * Math.cos(lon * rad), c * Math.sin(lon * rad), Math.sin(lat * rad)];
}
// Stylized flag bands, clipped to each country's land outline.
const flagBands = new Map([
  ['United States of America', [['#264882', .26], ['#fff3e8', .46], ['#d74c65', .64], ['#fff3e8', .82], ['#d74c65', 1]]],
  ['India', [['#ff9a48', 1/3], ['#fff6e5', 2/3], ['#39ae79', 1]]],
  ['South Korea', [['#f6f5ff', .45], ['#f15372', .72], ['#4d8df4', 1]]],
  ['Germany', [['#161729', 1/3], ['#ee4963', 2/3], ['#ffce52', 1]]],
]);
const surfaces = world.flatMap(feature => {
  const polygons = feature.geometry.type === 'Polygon' ? [feature.geometry.coordinates] : feature.geometry.coordinates;
  return polygons.map(polygon => ({
    featured: redLand.has(feature.properties.name),
    bands: flagBands.get(feature.properties.name),
    goldStars: feature.properties.name === "People's Republic of China",
    rings: polygon.map(ring => ring.map(([lon, lat]) => vector(lat, lon)))
  }));
});
const centers = leaders.map(point => vector(...point.position));
function interpolate(a, b, t) {
  const angle = Math.acos(Math.max(-1, Math.min(1, a.reduce((sum, value, i) => sum + value * b[i], 0))));
  if (angle < 0.00001) return a;
  const x = Math.sin((1 - t) * angle) / Math.sin(angle);
  const y = Math.sin(t * angle) / Math.sin(angle);
  return a.map((value, i) => x * value + y * b[i]);
}
let previousView;
function focusedRank(view) {
  let closest = 0;
  let best = -Infinity;
  for (const [index, point] of centers.entries()) {
    const alignment = point[0] * view[0] + point[1] * view[1] + point[2] * view[2];
    if (alignment > best) {
      closest = index;
      best = alignment;
    }
  }
  return closest;
}
function draw(view) {
  showRank(focusedRank(view));
  if (previousView === view) return;
  previousView = view;
  const [vx, vy, vz] = view;
  const horizontal = Math.hypot(vx, vy);
  const cx = vx / horizontal, sx = vy / horizontal;
  const gradient = ctx.createRadialGradient(285, 220, 20, center, center, radius);
  gradient.addColorStop(0, '#113658'); gradient.addColorStop(1, '#060d22');
  function project([x,y,z]) {
    return [(-sx*x+cx*y)*radius, (vz*(cx*x+sx*y)-horizontal*z)*radius, vx*x+vy*y+vz*z];
  }
  ctx.clearRect(0,0,800,800);
  ctx.save();
  ctx.beginPath(); ctx.arc(center,center,radius,0,2*Math.PI); ctx.clip();
  ctx.fillStyle = gradient; ctx.fillRect(0,0,800,800);
  for (const shape of surfaces) {
    ctx.beginPath();
    let visible = false;
    let top = Infinity, bottom = -Infinity;
    for (const ring of shape.rings) {
      let previous = project(ring[ring.length-1]);
      let first = true;
      for (const coordinate of ring) {
        const next = project(coordinate);
        if ((previous[2] >= 0) !== (next[2] >= 0)) {
          const t = previous[2] / (previous[2] - next[2]);
          const x = previous[0] + t*(next[0]-previous[0]);
          const y = previous[1] + t*(next[1]-previous[1]);
          const length = Math.hypot(x,y);
          ctx[first?'moveTo':'lineTo'](center+radius*x/length,center+radius*y/length);
          first = false;
        }
        if (next[2] >= 0) {
          if (shape.bands) {
            top = Math.min(top, center + next[1]);
            bottom = Math.max(bottom, center + next[1]);
          }
          ctx[first?'moveTo':'lineTo'](center+next[0],center+next[1]);
          first = false; visible = true;
        }
        previous = next;
      }
      if (!first) ctx.closePath();
    }
    if (!visible) continue;
    ctx.fillStyle = shape.goldStars ? '#ec4659' : '#194b56';
    if (shape.bands) {
      const fill = ctx.createLinearGradient(0, top, 0, Math.max(top + 1, bottom));
      let start = 0;
      for (const [color, end] of shape.bands) {
        fill.addColorStop(start, color);
        fill.addColorStop(end, color);
        start = end;
      }
      ctx.fillStyle = fill;
    }
    ctx.strokeStyle = shape.featured ? '#ff9ca3' : '#60d5df';
    ctx.lineWidth = 0.65; ctx.fill('evenodd'); ctx.stroke();
    if (shape.goldStars) {
      const [x, y, depth] = project(vector(41, 91));
      if (depth > .15) {
        ctx.save();
        ctx.clip('evenodd');
        ctx.fillStyle = '#ffdd59';
        for (const [dx, dy, size] of [[0,0,19], [24,-18,7], [34,-5,7], [33,11,7], [21,23,7]]) {
          const star = new Path2D();
          for (let point = 0; point < 10; point++) {
            const angle = point * Math.PI / 5 - Math.PI / 2;
            const radius = point % 2 ? size * .4 : size;
            const sx = center + x + dx + Math.cos(angle) * radius;
            const sy = center + y + dy + Math.sin(angle) * radius;
            if (point === 0) star.moveTo(sx, sy);
            else star.lineTo(sx, sy);
          }
          star.closePath();
          ctx.fill(star);
        }
        ctx.restore();
      }
    }
  }
  for (const [i, point] of centers.entries()) {
    const [x,y,depth] = project(point);
    if (depth < .07) continue;
    const badgeX = center + x + (['Germany', 'South Korea'].includes(leaders[i].country) ? (x > radius * .75 ? -48 : 48) : 0);
    if (badgeX !== center + x) {
      ctx.beginPath();
      ctx.moveTo(center + x, center + y);
      ctx.lineTo(badgeX, center + y);
      ctx.strokeStyle = '#fff2f2';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(badgeX,center+y,24,0,Math.PI*2);
    ctx.fillStyle='#8f204c'; ctx.fill(); ctx.strokeStyle='#fff2f2'; ctx.lineWidth=3; ctx.stroke();
    ctx.font='bold 20px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle='white';
    ctx.fillText('#'+(i+1),badgeX,center+y);
  }
  ctx.restore();
  ctx.beginPath(); ctx.arc(center,center,radius,0,2*Math.PI); ctx.strokeStyle='#69eeff';ctx.lineWidth=2;ctx.stroke();
}
const motion = matchMedia('(prefers-reduced-motion: reduce)');
const segment = 3450;
const firstSegment = 9000;
const cycleDuration = firstSegment + segment * (leaders.length - 1);
const rankStart = index => index === 0 ? 0 : firstSegment + (index - 1) * segment;
const rankAt = time => time < firstSegment ? 0 : 1 + Math.floor((time - firstSegment) / segment);
let elapsed = 0, last = null, frame = 0, shown = -1;
let resumeTimer;
for (const [index, point] of leaders.entries()) {
  const button = document.createElement('button');
  button.textContent = '#'+point.rank;
  button.setAttribute('aria-label', point.country);
  button.onclick = () => rotateToRank(index);
  byId('steps').append(button);
}
function showRank(index) {
  if (index === shown) return;
  shown = index;
  const point = leaders[index];
  byId('rank').textContent = 'Publication rank #' + point.rank;
  byId('place').textContent = point.country;
  byId('count').textContent = point.works.toLocaleString('en-US');
  [...byId('steps').children].forEach((button, i) =>
    button.setAttribute('aria-current', String(i === index)));
}
function pauseAnimation() {
  cancelAnimationFrame(frame);
  clearTimeout(resumeTimer);
  last = null;
}
function coordinates([x, y, z]) {
  return [Math.atan2(z, Math.hypot(x, y)) / rad, Math.atan2(y, x) / rad];
}
function rotateToRank(index) {
  pauseAnimation();
  rotateToView(centers[index], () => {
    elapsed = rankStart(index);
    showRank(index);
    if (!motion.matches) frame = requestAnimationFrame(tick);
  });
}
function rotateToView(target, done) {
  const [latitude, longitude] = coordinates(previousView);
  const [targetLatitude, targetLongitude] = coordinates(target);
  const longitudeDelta = ((targetLongitude - longitude + 540) % 360) - 180;
  if (motion.matches || Math.hypot(targetLatitude - latitude, longitudeDelta) < 0.1) {
    draw(target);
    done();
    return;
  }
  const start = performance.now();
  const duration = Math.min(1450, Math.max(650,
    Math.hypot(targetLatitude - latitude, longitudeDelta) * 8));
  function step(now) {
    const progress = Math.min(1, (now - start) / duration);
    const eased = progress * progress * (3 - 2 * progress);
    draw(vector(latitude + (targetLatitude - latitude) * eased,
      longitude + longitudeDelta * eased));
    if (progress < 1) frame = requestAnimationFrame(step);
    else done();
  }
  frame = requestAnimationFrame(step);
}
function rotateBy(deltaX, deltaY) {
  const [latitude, longitude] = coordinates(previousView);
  const scale = 150 / globe.getBoundingClientRect().width;
  draw(vector(Math.max(-85, Math.min(85, latitude + deltaY * scale)),
    longitude - deltaX * scale));
}
let drag;
globe.addEventListener('pointerdown', event => {
  if (event.button !== 0 || drag) return;
  pauseAnimation();
  drag = {id: event.pointerId, x: event.clientX, y: event.clientY};
  globe.setPointerCapture(event.pointerId);
});
globe.addEventListener('pointermove', event => {
  if (drag?.id !== event.pointerId) return;
  rotateBy(event.clientX - drag.x, event.clientY - drag.y);
  drag.x = event.clientX;
  drag.y = event.clientY;
});
globe.addEventListener('lostpointercapture', () => {
  drag = null;
  resumeTour();
});
globe.addEventListener('wheel', event => {
  if (event.ctrlKey || event.metaKey || drag || (!event.deltaX && !event.deltaY)) return;
  event.preventDefault();
  pauseAnimation();
  const unit = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? 100 : 1;
  rotateBy((event.deltaX || event.deltaY) * unit, event.deltaX ? event.deltaY * unit : 0);
  resumeTimer = setTimeout(resumeTour, 180);
}, {passive: false});
function tourView(time) {
  const index = rankAt(time);
  const fraction = (time - rankStart(index)) / (index === 0 ? firstSegment : segment);
  const opening = fraction ** 1.8;
  const progress = index === 0 ? opening * opening * (3 - 2 * opening) : fraction;
  const next = (index + 1) % centers.length;
  return interpolate(centers[index], centers[next], progress);
}
function render(time) {
  draw(tourView(time));
}
function tick(now) {
  if (last !== null) {
    elapsed = (elapsed + Math.min(now - last, 70)) % cycleDuration;
  }
  last = now;
  render(elapsed);
  frame = requestAnimationFrame(tick);
}
function resumeTour() {
  if (motion.matches || byId('tour').hidden || drag) return;
  pauseAnimation();
  rotateToView(tourView(elapsed), () => {
    frame = requestAnimationFrame(tick);
  });
}
function showMap() {
  pauseAnimation();
  byId('tour').hidden = true;
  byId('mapView').hidden = false;
  if (window.parent !== window) window.parent.postMessage('bioprinting-map-opened', '*');
  const iframe = byId('atlas');
  if (!iframe.hasAttribute('srcdoc')) iframe.srcdoc = JSON.parse(byId('atlasDocument').textContent);
  byId('backToGlobe').focus();
}
function closeMap() {
  byId('mapView').hidden = true;
  byId('tour').hidden = false;
  if (window.parent !== window) window.parent.postMessage('bioprinting-map-closed', '*');
  byId('openMap').focus();
  resumeTour();
}
byId('backToGlobe').onclick = closeMap;
if (window.parent !== window) {
  byId('nextSlide').hidden = false;
  byId('nextSlide').onclick = () => window.parent.postMessage('bioprinting-next-slide', '*');
}
byId('openMap').onclick = showMap;
window.addEventListener('message', event => {
  if (event.source === byId('atlas').contentWindow &&
      event.data === 'bioprinting-close-map' && !byId('mapView').hidden) closeMap();
  if (window.parent !== window && event.source === window.parent) {
    if (event.data === 'bioprinting-open-map' && !byId('tour').hidden) showMap();
    if (event.data === 'bioprinting-close-map' && !byId('mapView').hidden) closeMap();
  }
});
document.addEventListener('keydown', event => {
  if (event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
  if (event.key === 'ArrowDown' && !byId('tour').hidden) {
    event.preventDefault();
    showMap();
  } else if (event.key === 'Escape' && !byId('mapView').hidden) {
    event.preventDefault();
    closeMap();
  }
});
document.addEventListener('visibilitychange', () => {
  last = null;
});
render(0);
if (!motion.matches) frame = requestAnimationFrame(tick);
</script>
</body>
</html>
